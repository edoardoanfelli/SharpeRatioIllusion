[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharpe-illusion"
version = "0.1.0"
description = "Monte Carlo studies of when the Sharpe Ratio misleads, following Lo (2002) and Bailey & Lopez de Prado."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edoardo Anfelli" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sharpe_illusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
